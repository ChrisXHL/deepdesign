<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Systems · 多设计系统平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600;700;800&family=Source+Serif+Pro:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root{
      /* Notion Design System — Warm paper canvas */
      --color-canvas:#f6f5f4;          /* Paper Warmth — page background, the signature */
      --color-surface:#ffffff;          /* Pure White — card surfaces, elevated panels */
      --color-surface-warm:#f6f5f4;     /* Frost wash for secondary surfaces */
      --color-primary:#0075de;          /* Notion Blue — the single chromatic commitment */
      --color-primary-hover:#006bc9;
      --color-primary-soft:#e6f3fe;     /* Sky Tint — ghost CTA background */
      --color-text-primary:rgba(0,0,0,.88);    /* Ink Black 88% */
      --color-text-secondary:rgba(0,0,0,.60);  /* Ink Black 60% */
      --color-text-muted:rgba(0,0,0,.40);      /* Ink Black 40% */
      --color-text-tertiary:#757575;    /* Stone */
      --color-text-inverse:#ffffff;
      --color-body-text:#615d59;        /* Graphite — warm body text */
      --color-border:rgba(0,0,0,.08);   /* Hairline — the only border value */
      --color-border-soft:rgba(0,0,0,.06);
      /* Accent cast — like sticky notes */
      --accent-marigold:#ffb110;--accent-coral:#f64932;--accent-saffron:#e89d01;
      --accent-vermillion:#e32d14;--accent-mocha:#b18164;--accent-signal:#097fe8;
      --accent-skywash:#62aef0;--accent-midnight:#02093a;
      /* Typography */
      --font-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --font-serif:"Source Serif Pro",Georgia,"Times New Roman",serif;
      --font-mono:"JetBrains Mono","SF Mono",Consolas,ui-monospace,monospace;
      --font-serif-sc:"Noto Serif SC","Source Serif Pro",Georgia,serif;
      /* Radius — 4/8/12/pill */
      --radius-xs:4px;--radius-sm:8px;--radius-md:12px;--radius-lg:12px;--radius-pill:9999px;
      /* Motion */
      --motion-base:200ms;--ease-standard:ease;
      /* Max width */
      --max-width:1440px;
    }
    [data-theme="dark"]{
      --color-canvas:#191919;--color-surface:#202020;--color-surface-warm:#1e1e1e;
      --color-primary:#3b9eff;--color-primary-hover:#2d8fef;--color-primary-soft:#1a2a38;
      --color-text-primary:rgba(255,255,255,.90);--color-text-secondary:rgba(255,255,255,.60);
      --color-text-muted:rgba(255,255,255,.40);--color-text-tertiary:#8e8e93;
      --color-body-text:#a8a29e;--color-border:rgba(255,255,255,.10);--color-border-soft:rgba(255,255,255,.06);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:var(--font-body);background:var(--color-canvas);color:var(--color-text-primary);
      font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s}

    /* ===== Top bar ===== */
    .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;
      padding:12px 24px;background:rgba(246,245,244,.85);backdrop-filter:saturate(180%) blur(12px);
      border-bottom:1px solid var(--color-border)}
    [data-theme="dark"] .topbar{background:rgba(25,25,25,.85)}
    .brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600;letter-spacing:-.01em;
      color:var(--color-text-primary);text-decoration:none;cursor:pointer}
    .brand .logo-wrap{width:26px;height:26px;flex-shrink:0;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
    .brand:hover .logo-wrap{transform:scale(1.08) rotate(-3deg)}
    .brand .logo-wrap svg{width:100%;height:100%;display:block}
    .brand .logo-back{transform-origin:center;animation:logoFloat 5s ease-in-out infinite}
    .brand .logo-mid{transform-origin:center;animation:logoFloatMid 5s ease-in-out infinite .8s}
    .brand:hover .logo-back{animation-play-state:paused}
    .brand:hover .logo-mid{animation-play-state:paused}
    @keyframes logoFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(-1.5px,-1.5px)}}
    @keyframes logoFloatMid{0%,100%{transform:translate(0,0)}50%{transform:translate(-.8px,-.8px)}}
    @media(prefers-reduced-motion:reduce){.brand .logo-back,.brand .logo-mid{animation:none}.brand .logo-wrap{transition:none}}
    .topbar-spacer{flex:1}
    .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--radius-sm);
      background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text-primary);
      cursor:pointer;transition:background 200ms ease}
    .icon-btn:hover{background:var(--color-border)}
    .icon-btn svg{width:18px;height:18px}

    .about-btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 16px;border-radius:var(--radius-sm);
      background:transparent;border:1px solid var(--color-border);color:var(--color-text-secondary);
      cursor:pointer;font-family:var(--font-body);font-size:14px;font-weight:500;transition:all .2s ease}
    .about-btn:hover{background:var(--color-surface);border-color:var(--color-text-muted);color:var(--color-text-primary)}

    .about-modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
      background:rgba(0,0,0,.32);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s ease}
    .about-modal.open{opacity:1;pointer-events:auto}
    .about-modal-box{position:relative;width:420px;max-width:calc(100vw - 32px);background:var(--color-surface);
      border-radius:18px;border:1px solid var(--color-border);box-shadow:0 20px 60px rgba(0,0,0,.15);padding:32px;
      transform:translateY(12px);transition:transform .3s cubic-bezier(.16,1,.3,1)}
    .about-modal.open .about-modal-box{transform:translateY(0)}
    .about-modal-close{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;border:1px solid var(--color-border);
      background:var(--color-surface);cursor:pointer;display:flex;align-items:center;justify-content:center;
      color:var(--color-text-muted);transition:all .2s ease}
    .about-modal-close:hover{background:var(--color-canvas);color:var(--color-text-primary);border-color:var(--color-text-muted)}
    .about-modal-close svg{width:14px;height:14px}
    .about-title{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px;padding-right:32px}
    .about-subtitle{font-size:13px;color:var(--color-text-muted);margin:0 0 24px;line-height:1.5}
    .about-divider{height:1px;background:var(--color-border);margin:0 0 20px}
    .about-text{font-size:14px;color:var(--color-text-secondary);line-height:1.65;margin:0 0 20px}
    .about-contact{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--color-text-muted);font-family:var(--font-mono);letter-spacing:.01em}

    /* ===== Layout ===== */
    .view{max-width:1080px;margin:0 auto;padding:48px 24px 96px}
    .view.narrow{max-width:860px}

    /* ===== Gallery Hero — Clean ===== */
    .gallery-hero{position:relative;max-width:1080px;margin:0 auto 56px;
      min-height:380px;display:flex;align-items:center;justify-content:center;perspective:1000px}
    .hero-orbit{position:absolute;inset:-20px;overflow:visible;perspective:900px;transform-style:preserve-3d}
    .hero-orbit-item{position:absolute;will-change:transform;opacity:.65;transform-style:preserve-3d}
    [data-theme="dark"] .hero-orbit-item{opacity:.5}
    .orbit-swatch{border-radius:50%;
      box-shadow:0 10px 28px rgba(0,0,0,.22),0 3px 8px rgba(0,0,0,.13),
        inset 0 2px 5px rgba(255,255,255,.38),inset 0 -4px 9px rgba(0,0,0,.2)}
    .orbit-pill{border-radius:var(--radius-pill);font-size:11px;font-weight:600;color:#fff;
      display:flex;align-items:center;justify-content:center;padding:0 14px;white-space:nowrap;
      box-shadow:0 8px 22px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.13),
        inset 0 1px 2px rgba(255,255,255,.32)}
    .orbit-card{border-radius:var(--radius-sm);backdrop-filter:blur(6px);
      box-shadow:0 12px 34px rgba(0,0,0,.17),0 4px 10px rgba(0,0,0,.1),
        inset 0 1px 2px rgba(255,255,255,.16)}
    .orbit-type{font-weight:700;letter-spacing:-.02em;color:#fff;display:flex;
      align-items:center;justify-content:center;border-radius:var(--radius-xs);backdrop-filter:blur(6px);
      box-shadow:0 10px 26px rgba(0,0,0,.19),0 3px 7px rgba(0,0,0,.1),
        inset 0 1px 2px rgba(255,255,255,.2)}

    .hero-content{position:relative;z-index:2;text-align:center;padding:72px 40px;transform-style:preserve-3d}
    .hero-title{font-size:82px;line-height:.95;margin:0 0 24px;color:var(--color-text-primary);
      display:inline-flex;align-items:baseline;gap:2px}
    .hero-title .deep{font-family:var(--font-body);font-weight:800;letter-spacing:-.06em}
    .hero-title .sep{display:inline-block;width:4px;height:4px;border-radius:50%;
      background:var(--color-text-muted);margin:0 14px;align-self:center;flex-shrink:0}
    .hero-title .design{font-family:var(--font-serif);font-style:italic;font-weight:300;
      letter-spacing:.01em}
    .hero-slogan{margin:0}
    .poem{font-family:var(--font-serif-sc);margin:8px 0 0;padding:0}
    .poem-line{display:block;margin:0;font-weight:300;
      font-size:17px;line-height:2.5;color:var(--color-text-muted);letter-spacing:.14em}
    .poem-line.l1{font-size:20px;font-weight:400;color:var(--color-text-secondary);
      letter-spacing:.22em;margin-bottom:2px}
    .poem-line.l2 .w-space{letter-spacing:.5em;margin-right:-.5em}
    .poem-line.l3 .w-spring{color:#6b9b4a;font-weight:400}
    .poem-line.l4 .w-ink{opacity:.32;font-weight:300}

    .gallery-filter-row{display:flex;align-items:center;gap:12px;margin:0 0 28px;position:relative;min-height:36px}
    .gallery-filters{display:flex;flex-wrap:wrap;gap:8px;flex:1;padding-right:48px}

    .gallery-search-wrap{position:absolute;right:0;top:0;display:inline-flex;align-items:center;height:36px;width:36px;
      border:1px solid var(--color-border);border-radius:999px;background:var(--color-surface);overflow:hidden;
      transition:width .35s cubic-bezier(.25,.8,.25,1),border-color .25s ease,box-shadow .25s ease;z-index:10}
    .gallery-search-wrap.expanded{width:280px;border-color:var(--color-primary);
      box-shadow:0 0 0 4px rgba(0,117,222,.08)}
    .gallery-search-icon{width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;
      justify-content:center;color:var(--color-text-secondary);transition:all .25s cubic-bezier(.25,.8,.25,1);
      flex-shrink:0;position:absolute;left:0;top:0;z-index:2;background:transparent}
    .gallery-search-wrap:hover .gallery-search-icon{color:var(--color-primary)}
    .gallery-search-wrap.expanded .gallery-search-icon{color:var(--color-primary);transform:scale(.85);opacity:.7}
    .gallery-search-icon svg{width:16px;height:16px}
    .gallery-search-input{position:absolute;left:36px;right:0;top:0;bottom:0;display:flex;align-items:center;
      opacity:0;transition:opacity .25s ease .08s;pointer-events:none}
    .gallery-search-wrap.expanded .gallery-search-input{opacity:1;pointer-events:auto}
    .gallery-search{flex:1;border:none;outline:none;background:transparent;font-size:14px;
      font-family:var(--font-body);color:var(--color-text-primary);padding:0 8px 0 0;min-width:0}
    .gallery-search::placeholder{color:var(--color-text-muted)}
    .gallery-search-clear{width:20px;height:20px;border-radius:50%;border:none;background:var(--color-border);
      color:var(--color-text-secondary);cursor:pointer;display:none;align-items:center;
      justify-content:center;font-size:11px;line-height:1;flex-shrink:0;margin-right:8px;transition:background .15s}
    .gallery-search-clear:hover{background:var(--color-text-muted);color:#fff}
    .gallery-search-clear.visible{display:flex}

    .gallery-filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px}
    .gallery-filter-tag{display:inline-flex;align-items:center;height:36px;padding:0 16px;font-size:13px;font-weight:500;border-radius:9999px;
      border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-secondary);
      cursor:pointer;transition:all .2s;font-family:var(--font-body);line-height:1;
      box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .gallery-filter-tag:hover{border-color:var(--color-text-muted);color:var(--color-text-primary);
      transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .gallery-filter-tag.active{background:var(--color-primary);border-color:var(--color-primary);
      color:#fff;box-shadow:0 2px 8px rgba(0,117,222,.20);transform:translateY(-1px)}
    .gallery-filter-all{margin-right:6px;font-weight:600}
    .gallery-filter-all.has-count::after{content:attr(data-count);margin-left:6px;
      opacity:.7;font-weight:400}

    .gallery-no-results{text-align:center;padding:48px 20px;color:var(--color-text-muted);
      font-size:14px;line-height:1.6}

    .gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
    @media(max-width:768px){.gallery-grid{grid-template-columns:1fr}}

    /* System card — rich visual */
    .sys-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);
      overflow:hidden;cursor:pointer;transition:border-color .25s ease,box-shadow .25s ease;
      text-decoration:none;color:inherit;display:flex;flex-direction:column;position:relative}
    .sys-card:hover{border-color:rgba(0,117,222,.25);box-shadow:0 8px 30px rgba(0,0,0,.08)}

    .sys-card-cover{height:130px;position:relative;overflow:hidden;display:flex;align-items:flex-end;
      padding:22px 28px;transition:filter .2s ease,transform .5s ease;background-size:cover;background-position:center;
      isolation:isolate}
    .sys-card:hover .sys-card-cover{filter:brightness(1.05)}
    .sys-card-cover::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
      background-image:radial-gradient(circle,rgba(255,255,255,.12) 1px,transparent 1px);background-size:18px 18px;
      mask-image:linear-gradient(180deg,rgba(0,0,0,.5) 0%,transparent 100%);-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.5) 0%,transparent 100%)}
    .sys-card-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.55) 100%);pointer-events:none;z-index:1}
    .sys-card-cover-accent{position:absolute;border-radius:50%;filter:blur(36px);pointer-events:none;z-index:0;opacity:.45}
    .sys-card-cover-name{font-size:32px;font-weight:800;letter-spacing:-.03em;position:relative;z-index:3;
      line-height:1;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.35)}
    .sys-card-cover-org{position:absolute;top:16px;right:18px;font-size:10px;font-weight:600;text-transform:uppercase;
      letter-spacing:.08em;z-index:3;color:#fff;padding:4px 10px;border-radius:9999px;background:rgba(255,255,255,.15);
      backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.2);text-shadow:0 1px 2px rgba(0,0,0,.2)}

    /* Screenshot-based cover */
    .sys-card-cover-img-wrap{background:none !important}
    .sys-card-cover-img-wrap::before{display:none !important}
    .sys-cover-img{
      position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
      z-index:0;
    }
    .sys-cover-overlay{
      position:absolute;inset:0;z-index:1;pointer-events:none;
      background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.6) 100%);
    }

    .sys-card-preview{display:flex;align-items:center;gap:14px;padding:14px 24px;
      border-bottom:1px solid var(--color-border);background:var(--color-surface-warm)}
    .preview-swatches{display:flex;gap:5px}
    .preview-swatch{width:18px;height:18px;border-radius:50%;border:1px solid var(--color-border)}
    .preview-bar{width:1px;height:22px;background:var(--color-border)}
    .preview-btn{font-size:11px;font-weight:600;padding:4px 12px;border-radius:6px;color:#fff;letter-spacing:-.01em}
    .preview-type{font-size:17px;font-weight:700;letter-spacing:-.02em;margin-left:auto;color:var(--color-text-muted)}

    .sys-card-info{padding:20px 24px 24px;flex:1;display:flex;flex-direction:column}
    .sys-card-tagline{font-size:15px;font-weight:600;color:var(--color-text-primary);margin:0 0 6px;letter-spacing:-.01em}
    .sys-card-desc{font-size:13.5px;color:var(--color-text-secondary);line-height:1.55;margin:0 0 16px;flex:1}
    .sys-card-modules{display:flex;gap:6px;flex-wrap:wrap}
    .mod-link{font-size:12px;font-weight:500;padding:5px 12px;border-radius:var(--radius-xs);
      background:var(--color-surface-warm);color:var(--color-text-secondary);border:1px solid var(--color-border);
      display:inline-flex;align-items:center;gap:5px;transition:all .18s ease;text-decoration:none;cursor:pointer}
    .mod-link:hover{background:var(--color-primary-soft);color:var(--color-primary);border-color:rgba(0,117,222,.3)}
    .mod-link svg{width:12px;height:12px}

    .gallery-footer{text-align:center;padding:36px 0 0}
    .gallery-add-link{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;
      color:var(--color-text-muted);cursor:pointer;transition:color .2s ease}
    .gallery-add-link:hover{color:var(--color-primary)}
    .gallery-add-link svg{width:16px;height:16px}

    /* ===== Add System Modal ===== */
    .modal-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
      background:rgba(0,0,0,.36);backdrop-filter:blur(8px);opacity:0;will-change:opacity}
    .modal-box{position:relative;width:520px;max-width:calc(100vw - 32px);background:var(--color-surface);
      border-radius:18px;border:1px solid rgba(0,0,0,.08);
      box-shadow:0 24px 80px rgba(0,0,0,.2),0 10px 24px rgba(0,0,0,.1);
      padding:0;will-change:transform,opacity;overflow:hidden}
    .modal-hero{padding:28px 32px 22px;background:linear-gradient(180deg,var(--color-canvas) 0%,var(--color-surface) 100%);
      border-bottom:1px solid var(--color-border);position:relative}
    .modal-hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
      background:linear-gradient(90deg,transparent,var(--color-border),transparent)}
    .modal-title{font-size:22px;font-weight:700;color:var(--color-text-primary);margin:0 0 6px;letter-spacing:-.02em}
    .modal-desc{font-size:14px;color:var(--color-text-secondary);margin:0;line-height:1.6}
    .modal-body{padding:24px 32px 32px}
    .modal-field{margin-bottom:20px}
    .modal-field label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
      color:var(--color-text-primary);margin-bottom:8px}
    .modal-field label .hint{font-weight:400;color:var(--color-text-muted)}
    .modal-field input,.modal-field textarea{width:100%;font-family:var(--font-body);font-size:15px;
      color:var(--color-text-primary);background:var(--color-canvas);border:1px solid var(--color-border);
      border-radius:12px;padding:12px 14px;transition:border-color .2s ease,box-shadow .2s ease,background .2s ease;outline:none;resize:none}
    .modal-field input:hover,.modal-field textarea:hover{background:#fff;border-color:rgba(0,117,222,.35)}
    .modal-field input:focus,.modal-field textarea:focus{border-color:var(--color-primary);background:#fff;
      box-shadow:0 0 0 4px rgba(0,117,222,.1)}
    .modal-field textarea{min-height:92px;line-height:1.55}
    .modal-field input::placeholder,.modal-field textarea::placeholder{color:var(--color-text-muted)}
    .modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:4px}
    .modal-btn{font-family:var(--font-body);font-size:14px;font-weight:600;padding:11px 20px;border-radius:12px;
      cursor:pointer;transition:transform .15s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;border:1px solid var(--color-border);
      background:var(--color-surface);color:var(--color-text-secondary)}
    .modal-btn:hover{background:var(--color-canvas);transform:translateY(-1px)}
    .modal-btn:active{transform:translateY(0)}
    .modal-btn-primary{background:var(--color-primary);color:#fff;border-color:var(--color-primary);
      box-shadow:0 1px 2px rgba(0,117,222,.2),0 4px 12px rgba(0,117,222,.18)}
    .modal-btn-primary:hover{background:var(--color-primary-hover);border-color:var(--color-primary-hover);
      transform:translateY(-1px);box-shadow:0 1px 2px rgba(0,117,222,.25),0 6px 16px rgba(0,117,222,.22)}
    .modal-btn-primary:active{transform:translateY(0)}
    .modal-close{position:absolute;top:18px;right:18px;width:32px;height:32px;display:flex;align-items:center;
      justify-content:center;border-radius:50%;cursor:pointer;color:var(--color-text-muted);
      background:var(--color-canvas);border:1px solid var(--color-border);transition:background .18s ease,color .18s ease,border-color .18s ease,transform .15s ease}
    .modal-close:hover{background:var(--color-surface);color:var(--color-text-primary);border-color:var(--color-border);transform:rotate(90deg)}
    .modal-close svg{width:16px;height:16px}
    .modal-success{text-align:center;padding:36px 32px 40px}
    .modal-success .success-icon{width:64px;height:64px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;
      border-radius:50%;background:rgba(16,163,127,.1);box-shadow:0 0 0 8px rgba(16,163,127,.04)}
    .modal-success .success-icon svg{width:30px;height:30px}
    .modal-success .modal-title{margin-bottom:10px}
    .modal-success .modal-desc{margin-bottom:28px}
    .modal-success .modal-actions{justify-content:center}
    .modal-email-box{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--color-canvas);
      border:1px solid var(--color-border);border-radius:var(--radius-sm);margin-bottom:0}
    .modal-email-box code{flex:1;font-family:var(--font-mono);font-size:15px;font-weight:500;color:var(--color-primary);
      letter-spacing:.02em;text-align:center}
    .modal-copy-email-btn{font-family:var(--font-body);font-size:13px;font-weight:500;padding:6px 14px;
      border-radius:var(--radius-xs);border:1px solid var(--color-border);background:var(--color-surface);
      color:var(--color-text-secondary);cursor:pointer;transition:all .15s;flex-shrink:0;white-space:nowrap}
    .modal-copy-email-btn:hover{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
    .modal-copy-email-btn.copied{background:#10A37F;border-color:#10A37F;color:#fff}

    /* ===== GSAP animation helpers ===== */
    .gallery-grid{perspective:1200px}
    .sys-card{will-change:transform,box-shadow}
    .sys-card-shine{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:5;border-radius:var(--radius-md);
      background:radial-gradient(circle at var(--shine-x,50%) var(--shine-y,50%),rgba(255,255,255,.12) 0%,transparent 50%);
      transition:opacity .25s ease}
    .view-transition{opacity:0;transform:translateY(10px)}
    /* GSAP hover will-change */
    .brand,.icon-btn,.about-btn,.about-modal-close,.module-tab,.btn,.a-btn,.copy-btn,.download-btn,
    .swatch,.a-swatch,.demo-card,
    .a-component-card,.a-service-card,.mod-link,.gallery-add-link,
    .tag,.icon-tile,.seg button,.a-ghost-link,.a-nav-link,
    .radius-demo,.a-radius-demo,.elev-demo,.a-surface-demo,
    .preview-swatch,.case-frame,.a-product-img,.a-footer-col a,
    .hero-content,.hero-orbit,.hero-title,.section-title,.a-section-title,
    .type-row,.a-type-row,.spacing-row,.a-spacing-row
    {will-change:transform}

    /* ===== System view: tabs ===== */
    .sys-header{margin-bottom:32px}
    .sys-header h1{font-size:32px;font-weight:700;letter-spacing:-.016em;margin:0 0 6px}
    .sys-header p{font-size:16px;color:var(--color-text-secondary);margin:0}
    .module-tabs{display:flex;gap:0;border-bottom:1px solid var(--color-border);margin-bottom:32px}
    .module-tab{padding:12px 18px;font-size:15px;font-weight:500;color:var(--color-text-secondary);cursor:pointer;
      border:none;background:transparent;border-bottom:2px solid transparent;font-family:var(--font-body);
      transition:color 200ms ease,border-color 200ms ease;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
    .module-tab:hover{color:var(--color-text-primary)}
    .module-tab.active{color:var(--color-primary);border-bottom-color:var(--color-primary)}
    .module-tab svg{width:16px;height:16px}

    /* ===== Animation Module — Notion-style redesign ===== */

    /* Hero section: warm background, centered */
    .anim-hero{
      text-align:center;
      padding:52px 28px 42px;
      background:#faf9f7;
      border:1px solid #e8e5df;
      border-radius:14px;
      margin-bottom:20px;
    }
    [data-theme="dark"] .anim-hero{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.08)}
    .anim-hero-icon{
      width:60px;height:60px;
      border-radius:50%;
      background:rgba(124,77,194,.08);
      display:inline-flex;align-items:center;justify-content:center;
      margin:0 auto 18px;
    }
    .anim-hero-icon svg{width:30px;height:30px;color:#7c4dc2}
    [data-theme="dark"] .anim-hero-icon svg{color:#a78bfa}
    .anim-hero-title{
      font-size:23px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px;
      color:var(--color-text-primary);
    }
    .anim-hero-sub{
      font-size:14.5px;color:var(--color-text-secondary);margin:0;
      max-width:420px;margin:0 auto;line-height:1.58;
    }

    /* Main card: white surface, clean border */
    .anim-card{
      background:var(--color-surface);
      border:1px solid var(--color-border);
      border-radius:14px;
      overflow:hidden;
      margin-bottom:20px;
      box-shadow:0 1px 3px rgba(0,0,0,.04);
    }

    /* Card header: brand logo + title + description */
    .anim-card-header{
      padding:26px 28px 22px;
      border-bottom:1px solid var(--color-border);
    }
    .anim-brand{display:flex;align-items:flex-start;gap:16px}
    .anim-brand-icon{
      width:48px;height:48px;
      border-radius:12px;
      background:linear-gradient(145deg,#764abc,#0dae42);
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;
      box-shadow:0 4px 16px rgba(118,74,188,.25);
    }
    .anim-brand-icon svg{width:24px;height:24px;color:#fff}
    .anim-brand-info{flex:1;min-width:0}
    .anim-brand-title{
      font-size:17.5px;font-weight:700;letter-spacing:-.02em;margin:0 0 5px;
      color:var(--color-text-primary);
    }
    .anim-brand-desc{
      font-size:13px;color:var(--color-text-secondary);margin:0;line-height:1.55;
    }

    /* Three-column feature cards */
    .anim-features{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:0;
      padding:0;
    }
    @media(max-width:720px){.anim-features{grid-template-columns:1fr}}
    .anim-feature{
      padding:26px 20px;
      text-align:center;
      border-right:1px solid var(--color-border);
      transition:background .15s ease;
    }
    .anim-feature:last-child{border-right:none}
    @media(max-width:720px){.anim-feature{border-right:none;border-bottom:1px solid var(--color-border)}.anim-feature:last-child{border-bottom:none}}
    .anim-feature:hover{background:rgba(0,0,0,.015)}
    [data-theme="dark"] .anim-feature:hover{background:rgba(255,255,255,.03)}
    .anim-feature-icon{
      width:40px;height:40px;
      margin:0 auto 12px;
      display:flex;align-items:center;justify-content:center;
    }
    .anim-feature-icon svg{width:24px;height:24px;color:var(--color-text-secondary)}
    .anim-feature-title{
      font-size:14.5px;font-weight:600;margin:0 0 5px;
      color:var(--color-text-primary);
    }
    .anim-feature-desc{
      font-size:12.5px;color:var(--color-text-secondary);margin:0 0 8px;line-height:1.48;
    }
    .anim-feature-link{
      display:inline-block;
      font-size:13px;font-weight:500;
      color:var(--color-primary);
      text-decoration:none;
      transition:opacity .15s;
    }
    .anim-feature-link:hover{opacity:.75;text-decoration:underline}

    /* Install command bar */
    .anim-install{
      padding:22px 28px 26px;
      border-top:1px solid var(--color-border);
    }
    .anim-install-hint{
      font-size:12.5px;color:var(--color-text-muted);margin:0 0 12px;
      letter-spacing:.01em;
    }
    .anim-install-bar{
      display:flex;align-items:stretch;
      border:1px solid var(--color-border);
      border-radius:10px;
      overflow:hidden;
      box-shadow:0 1px 3px rgba(0,0,0,.04);
    }
    .anim-install-code{
      flex:1;display:flex;align-items:center;
      padding:13px 18px;
      background:var(--color-canvas);
      font-family:var(--font-mono);
      font-size:13px;
      color:var(--color-text-primary);
      line-height:1.55;
      word-break:break-all;
      min-width:0;
      border:none;
    }
    .anim-copy-btn{
      display:inline-flex;align-items:center;gap:7px;
      padding:0 22px;
      font-size:13px;font-weight:600;
      border:none;
      background:linear-gradient(145deg,#764abc,#5a2d9e);
      color:#fff;
      cursor:pointer;
      transition:all .2s ease;
      font-family:var(--font-body);
      flex-shrink:0;
      white-space:nowrap;
      border-radius:0;
    }
    .anim-copy-btn:hover{background:linear-gradient(145deg,#8754cf,#6b38b5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
    .anim-copy-btn svg{width:15px;height:15px;flex-shrink:0}
    .anim-copy-btn.copied{background:linear-gradient(145deg,#0dae42,#098a34)}

    /* Preview grid */
    .anim-preview{
      border:1px solid var(--color-border);
      border-radius:14px;
      padding:26px 28px;
      background:var(--color-surface);
    }
    .anim-preview-label{
      font-size:15px;font-weight:600;margin:0 0 18px;letter-spacing:-.01em;
      color:var(--color-text-primary);
    }
    .anim-preview-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    }
    @media(max-width:640px){.anim-preview-grid{grid-template-columns:repeat(2,1fr)}}
    .anim-preview-item{
      display:flex;flex-direction:column;align-items:center;gap:5px;
      padding:18px 10px;
      border-radius:10px;
      background:var(--color-canvas);
      text-align:center;
      transition:background .15s ease,transform .2s ease;
      border:1px solid transparent;
    }
    .anim-preview-item:hover{
      background:var(--color-surface-warm);
      transform:translateY(-2px);
      border-color:var(--color-border);
    }
    .anim-preview-icon{font-size:24px;line-height:1}
    .anim-preview-name{font-size:13px;font-weight:600;color:var(--color-text-primary)}
    .anim-preview-tag{font-size:11px;color:var(--color-text-muted)}

    /* ===== Doc module ===== */
    .doc-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .doc-toolbar .spacer{flex:1}
    .seg{display:flex;background:var(--color-surface);border-radius:var(--radius-sm);padding:3px;border:1px solid var(--color-border)}
    .seg button{padding:6px 14px;font-size:13px;font-weight:500;border:none;background:transparent;cursor:pointer;
      border-radius:var(--radius-xs);color:var(--color-text-secondary);font-family:var(--font-body);transition:all 200ms ease}
    .seg button.active{background:var(--color-canvas);color:var(--color-text-primary)}
    .copy-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:14px;font-weight:500;
      background:var(--color-primary);color:var(--color-text-inverse);border:none;border-radius:var(--radius-sm);
      cursor:pointer;font-family:var(--font-body);transition:background 200ms ease}
    .copy-btn:hover{background:var(--color-primary-hover)}
    .copy-btn.copied{background:#15c46e}
    .copy-btn svg{width:15px;height:15px}
    .download-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:14px;font-weight:500;
      background:var(--color-surface);color:var(--color-text-primary);border:1px solid var(--color-border);
      border-radius:var(--radius-sm);cursor:pointer;font-family:var(--font-body);transition:background 200ms ease,border-color 200ms ease}
    .download-btn:hover{background:var(--color-canvas);border-color:var(--color-primary)}
    .download-btn svg{width:15px;height:15px}
    .doc-raw{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);
      padding:24px;overflow:auto;font-family:var(--font-mono);font-size:13px;line-height:1.7;color:var(--color-text-primary);
      white-space:pre-wrap;word-break:break-word;max-height:70vh}
    .doc-rendered{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);
      padding:40px;max-height:70vh;overflow:auto;line-height:1.7}
    .doc-rendered h1{font-size:30px;font-weight:700;letter-spacing:-.018em;margin:0 0 16px}
    .doc-rendered h2{font-size:22px;font-weight:600;margin:32px 0 12px;border-bottom:1px solid var(--color-border);padding-bottom:8px}
    .doc-rendered h3{font-size:18px;font-weight:600;margin:24px 0 8px}
    .doc-rendered p{margin:0 0 14px;color:var(--color-text-primary)}
    .doc-rendered table{width:100%;border-collapse:collapse;font-size:14px;margin:12px 0}
    .doc-rendered th,.doc-rendered td{text-align:left;padding:8px 12px;border:1px solid var(--color-border)}
    .doc-rendered th{background:var(--color-canvas);font-weight:500}
    .doc-rendered code{font-family:var(--font-mono);font-size:13px;background:var(--color-primary-soft);padding:2px 6px;border-radius:var(--radius-xs)}
    .doc-rendered pre{background:var(--color-canvas);padding:16px;border-radius:var(--radius-sm);overflow:auto;font-size:13px;border:1px solid var(--color-border)}
    .doc-rendered pre code{background:none;padding:0}
    .doc-rendered blockquote{border-left:3px solid var(--color-primary);margin:16px 0;padding:4px 16px;color:var(--color-text-secondary);font-family:var(--font-serif);font-style:italic}
    .doc-rendered ul,.doc-rendered ol{padding-left:24px;margin:0 0 14px}

    /* ===== System showcase (shared styles) ===== */
    .section{margin-bottom:64px;scroll-margin-top:80px}
    .section-title{font-size:24px;font-weight:700;letter-spacing:-.014em;margin:0 0 6px}
    .section-desc{font-size:15px;color:var(--color-text-secondary);margin:0 0 24px;line-height:1.56}
    .grid{display:grid;gap:16px}
    .grid-2{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(3,1fr)}.grid-4{grid-template-columns:repeat(4,1fr)}
    @media(max-width:768px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
    .panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:20px}
    .panel-label{font-size:12px;font-weight:500;color:var(--color-text-muted);margin-bottom:12px;font-family:var(--font-mono)}
    .row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .mono{font-family:var(--font-mono);font-size:13px;color:var(--color-text-muted)}

    .swatch{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--color-border)}
    .swatch-top{height:64px;display:flex;align-items:flex-end;padding:10px;font-size:12px;font-weight:500;font-family:var(--font-mono)}
    .swatch-meta{padding:10px;background:var(--color-surface)}
    .swatch-name{font-size:13px;font-weight:500}.swatch-hex{font-size:11px;color:var(--color-text-muted);font-family:var(--font-mono)}

    .type-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--color-border)}
    .type-row:last-child{border:none}
    .type-meta{font-size:11px;color:var(--color-text-muted);font-family:var(--font-mono);white-space:nowrap}

    .spacing-row{display:flex;align-items:center;gap:16px;padding:5px 0}
    .spacing-bar{height:18px;background:var(--color-primary);border-radius:3px}
    .spacing-label{font-family:var(--font-mono);font-size:12px;color:var(--color-text-secondary);min-width:84px}
    .spacing-value{font-family:var(--font-mono);font-size:12px;color:var(--color-text-muted);min-width:44px}

    .radius-demo{width:60px;height:60px;background:var(--color-text-primary)}
    .elev-demo{width:80px;height:80px;background:var(--color-surface);border-radius:var(--radius-md);display:grid;
      place-items:center;font-size:11px;font-family:var(--font-mono);color:var(--color-text-muted);border:1px solid var(--color-border)}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body);font-size:15px;
      border:none;border-radius:var(--radius-sm);cursor:pointer;transition:all 200ms ease}
    .btn-primary{background:var(--color-primary);color:var(--color-text-inverse);padding:10px 20px;font-weight:500}
    .btn-primary:hover{background:var(--color-primary-hover)}
    .btn-secondary{background:var(--color-primary-soft);color:var(--color-primary);padding:10px 20px;font-weight:500;border:1px solid transparent}
    .btn-secondary:hover{background:#d4eafd}
    .btn-ghost{background:transparent;color:var(--color-text-primary);padding:8px 12px;font-weight:400;border-radius:var(--radius-xs)}
    .btn-ghost:hover{background:var(--color-border)}
    .btn-accent{background:var(--color-primary);color:var(--color-text-inverse);padding:10px 20px;font-weight:500}
    .btn-accent:hover{background:var(--color-primary-hover)}
    .btn-sm{font-size:13px;padding:6px 14px}

    .demo-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);
      padding:20px;transition:transform 200ms ease,border-color 200ms ease}
    .demo-card:hover{transform:translateY(-2px);border-color:rgba(0,0,0,.16)}
    .demo-card-title{font-size:16px;font-weight:600;margin:0 0 6px}
    .demo-card-text{font-size:14px;color:var(--color-text-secondary);margin:0}

    .text-input{width:100%;padding:12px 16px;background:var(--color-surface);color:var(--color-text-primary);
      font-family:var(--font-body);font-size:15px;border:1px solid var(--color-border);border-radius:var(--radius-sm);
      outline:none;transition:border-color 200ms ease,box-shadow 200ms ease}
    .text-input:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(0,117,222,.15)}
    .text-input::placeholder{color:var(--color-text-muted)}
    .form-label{display:block;font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:6px}

    .tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;font-size:12px;font-weight:500;border-radius:var(--radius-pill)}
    .tag-default{background:var(--color-canvas);color:var(--color-text-secondary)}
    [data-theme="dark"] .tag-default{background:#2a2a2a;color:#c1c1c1}
    .tag-accent{background:var(--color-primary-soft);color:var(--color-primary)}
    .tag-danger{background:rgba(246,73,50,.12);color:var(--accent-coral)}
    .tag-dark{background:var(--color-text-primary);color:var(--color-text-inverse)}
    .tag-dot{width:6px;height:6px;border-radius:50%;background:currentColor}

    .toggle{position:relative;width:40px;height:24px;background:var(--color-border);border-radius:var(--radius-pill);
      cursor:pointer;border:none;flex-shrink:0;transition:background 200ms ease}
    .toggle.on{background:var(--color-primary)}
    .toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;
      transition:transform 200ms ease}
    .toggle.on::after{transform:translateX(16px)}

    .token-table{width:100%;border-collapse:collapse;font-size:13px}
    .token-table th,.token-table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--color-border)}
    .token-table th{font-weight:500;color:var(--color-text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
    .token-table td code{font-family:var(--font-mono);font-size:12px;color:var(--color-primary)}

    .icon-tile{width:48px;height:48px;display:grid;place-items:center;background:var(--color-canvas);border-radius:var(--radius-sm);
      color:var(--color-text-secondary);transition:all 200ms ease;border:1px solid var(--color-border)}
    .icon-tile:hover{background:var(--color-primary-soft);color:var(--color-primary);border-color:var(--color-primary)}
    .icon-tile svg{width:22px;height:22px}

    /* ===== Case module (landing page demo) ===== */
    .case-frame{border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;background:var(--color-surface)}
    .case-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--color-canvas);border-bottom:1px solid var(--color-border)}
    .case-dot{width:12px;height:12px;border-radius:50%;background:var(--color-border)}
    .case-url{flex:1;font-size:12px;color:var(--color-text-muted);font-family:var(--font-mono);text-align:center}

    /* ── New case design ── */
    .case-banner{position:relative;padding:56px 32px;text-align:center;overflow:hidden}
    .case-banner::before{content:'';position:absolute;inset:0;opacity:.08;
      background:radial-gradient(circle at 30% 20%, var(--case-accent,#0075de) 0%,transparent 50%),
                 radial-gradient(circle at 70% 80%, var(--case-accent,#0075de) 0%,transparent 50%)}
    .case-banner-icon{width:52px;height:52px;border-radius:14px;margin:0 auto 16px;
      background:var(--case-accent,#0075de);display:flex;align-items:center;justify-content:center;
      color:#fff;font-size:22px;font-weight:700;font-family:var(--font-body);position:relative}
    .case-banner h2{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px;position:relative}
    .case-banner .case-tagline{font-size:16px;color:var(--color-text-secondary);margin:0;position:relative;max-width:480px;margin:0 auto;line-height:1.5}
    .case-screenshot{position:relative;margin:-24px 24px 0;border-radius:12px;
      overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.12);border:1px solid var(--color-border)}
    .case-screenshot img{width:100%;height:auto;display:block}
    .case-mockup{overflow:hidden}
    .case-mock-hero h3{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
    @media(max-width:640px){.case-mock-hero h3{font-size:22px}}
    .case-details{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--color-border)}
    @media(max-width:640px){.case-details{grid-template-columns:1fr}}
    .case-palette{padding:28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .case-palette-label{font-size:12px;font-weight:600;text-transform:uppercase;

<body>
  <!-- Top bar -->

      </svg>

  <div id="app"></div>

  <script>
    /* ===== Data: lazy-load design systems from external files ===== */
    let systemManifest = [];        /* loaded from systems/manifest.json */
    let systemCache  = {};          /* in-memory cache: {id: {meta, designMd}} */
    let dataReady     = false;

    async function loadManifest(){
      if(dataReady) return systemManifest;
      try {
        const r = await fetch('systems/manifest.json');
        if(!r.ok) throw new Error('manifest not found');
        systemManifest = await r.json();
        dataReady = true;
      }catch(e){
        systemManifest = [];
      }
      return systemManifest;
    }

    async function loadSystem(id){
      if(systemCache[id]) return systemCache[id];
      const [metaR, mdR] = await Promise.all([
        fetch(`systems/${id}/meta.json`),
        fetch(`systems/${id}/design.md`)
      ]);
      const meta = metaR.ok ? await metaR.json() : {};
      const designMd = mdR.ok ? await mdR.text() : '';
      systemCache[id] = {...meta, designMd};
      return systemCache[id];
    }

    let dataInitPromise = loadManifest();

    const MODULE_META = {
      doc:{label:'文档',icon:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>'},
      system:{label:'设计系统',icon:'<circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>'},
      case:{label:'案例',icon:'<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>'},
      source:{label:'设计源',icon:'<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>'},
      animation:{label:'动效',icon:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>'}
    };

    const app = document.getElementById('app');
    const root = document.documentElement;

    /* ===== Router ===== */
    function parseHash(){
      const h = location.hash.replace(/^#\//,'');
      const parts = h.split('/').filter(Boolean);
      return { sys: parts[0]||null, mod: parts[1]||null };
    }
    function navigate(path){
      location.hash = path;
      render();
    }
    window.addEventListener('hashchange', ()=>render());

    document.addEventListener('click', e=>{
      const el = e.target.closest('[data-route]');
      if(el){ e.preventDefault(); navigate(el.getAttribute('data-route')); }
    });

    /* ===== Theme ===== */
    const sunPath='<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
    const moonPath='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    document.getElementById('themeToggle').addEventListener('click',()=>{
      const dark = root.getAttribute('data-theme')==='dark';
      root.setAttribute('data-theme', dark?'light':'dark');
      document.getElementById('themeIcon').innerHTML = dark?moonPath:sunPath;
      if(window.gsap && !reducedMotion()){
        gsap.fromTo('#themeIcon', { rotation: -90, scale: .8 }, { rotation: 0, scale: 1, duration: .45, ease: 'back.out(1.7)' });
      }
    });

    /* ===== About Modal ===== */
    document.getElementById('aboutBtn').addEventListener('click', openAboutModal);
    function openAboutModal(){
      var existing = document.getElementById('aboutModal');
      if(existing){ existing.classList.add('open'); return; }
      var overlay = document.createElement('div');
      overlay.id = 'aboutModal';
      overlay.className = 'about-modal open';
      overlay.innerHTML = '<div class="about-modal-box">'+
        '<button class="about-modal-close" id="aboutModalClose" aria-label="关闭">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'+
        '</button>'+
        '<h2 class="about-title">AI 共生</h2>'+
        '<p class="about-subtitle">AI 工具产品经理 | 0-1 创业产品负责人</p>'+
        '<div class="about-divider"></div>'+
        '<p class="about-text">这里不神化 AI，也不贩卖焦虑。更多时候，我们只是带着清醒、好奇和实践感，去理解这个正在到来的共生时代。</p>'+
        '<span class="about-contact">📮 3020006530@qq.com</span>'+
      '</div>';

    /* ===== Gallery search & filter ===== */
    var activeFilter = null;
    var searchQuery = '';

    function renderFilteredCards(){
      var allTags = new Set();
      systemManifest.forEach(s=>{(s.tags||[]).forEach(t=>allTags.add(t))});
      var tagsHTML = '<button class="gallery-filter-tag gallery-filter-all'+
        (activeFilter===null?' active':'')+'" data-tag="">全部</button>';
      allTags.forEach(t=>{
        var count = systemManifest.filter(s=>(s.tags||[]).includes(t)).length;
        tagsHTML += '<button class="gallery-filter-tag'+(activeFilter===t?' active':'')+
          '" data-tag="'+t+'">'+t+'<span style="opacity:.55;margin-left:5px;font-size:11px">'+count+'</span></button>';
      });
      var filterEl = document.getElementById('galleryFilters');
      if(filterEl) filterEl.innerHTML = tagsHTML;

      /* ── filter cards ── */
      var filtered = systemManifest.filter(s=>{
        if(activeFilter && !(s.tags||[]).includes(activeFilter)) return false;
        if(searchQuery){
          var q = searchQuery.toLowerCase();
          if(!(s.name||'').toLowerCase().includes(q) &&
             !(s.tagline||'').toLowerCase().includes(q) &&
             !(s.desc||'').toLowerCase().includes(q) &&
             !(s.org||'').toLowerCase().includes(q)) return false;
        }
        return true;
      });

      var gridEl = document.getElementById('galleryGrid');
      if(!gridEl) return;

      if(filtered.length===0){
        gridEl.innerHTML = '<div class="gallery-no-results">没有匹配的设计系统<br>试试更换关键词或清除筛选</div>';
      }else{
        var cards = filtered.map(renderCard).join('');
        gridEl.innerHTML = cards;
      }

      /* rebind filter tag clicks */
      var tags = document.querySelectorAll('.gallery-filter-tag');
      tags.forEach(tag=>{
        tag.addEventListener('click',function(){
          var t = this.dataset.tag;
          activeFilter = t || null;
          renderFilteredCards();
        });
      });

      if(filtered.length>0 && window.gsap && !reducedMotion()) bindCardHover();
    }

    function renderCard(s){

    function bindGallerySearch(){
      var search = document.getElementById('gallerySearch');
      var clear = document.getElementById('searchClear');
      var icon = document.getElementById('searchIcon');
      var wrap = document.getElementById('searchWrap');
      if(icon){
        icon.addEventListener('click',function(){
          var isExpanded = wrap.classList.contains('expanded');
          if(isExpanded){
            if(search.value.trim()){
              search.value = '';
              searchQuery = '';
              clear.classList.remove('visible');
              renderFilteredCards();
            }
            wrap.classList.remove('expanded');
          } else {
            wrap.classList.add('expanded');
            setTimeout(function(){ search.focus(); }, 120);
          }
        });
      }
      if(search){
        search.addEventListener('input',function(){
          searchQuery = this.value.trim();
          clear.classList.toggle('visible', searchQuery.length>0);
          renderFilteredCards();
        });
        search.addEventListener('blur',function(){
          setTimeout(function(){
            if(!search.value.trim()){
              wrap.classList.remove('expanded');
            }
          },200);
        });
      }
      if(clear){
        clear.addEventListener('click',function(e){
          e.stopPropagation();
          search.value = '';
          searchQuery = '';
          this.classList.remove('visible');
          renderFilteredCards();
          search.focus();
        });
      }
    }

    /* ===== System view with module tabs ===== */
    async function systemView(sysId, mod){
      const sys = systemManifest.find(s=>s.id===sysId);
      if(!sys){ galleryView(); return; }
      const fullSys = await loadSystem(sysId);
      const modules = fullSys.modules || ['doc','system','case','source'];
      mod = mod && modules.includes(mod) ? mod : modules[0];

      const tabs = modules.map(m=>`<a class="module-tab ${m===mod?'active':''}" data-route="/${sysId}/${m}" href="#/${sysId}/${m}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${MODULE_META[m].icon}</svg>${MODULE_META[m].label}
      </a>`).join('');

      let content='';
      if(mod==='doc') content = docModule(fullSys, fullSys.designMd);
      else if(mod==='system') content = buildSystemModule(fullSys);
      else if(mod==='case') content = buildCaseModule(fullSys);
      else if(mod==='source') content = sourceModule(fullSys);
      else if(mod==='animation') content = buildAnimationModule(fullSys);

      app.innerHTML = `<div class="view narrow">
        <div class="sys-header">
          <h1>${fullSys.name} 设计系统</h1>
          <p>${fullSys.org} · ${fullSys.tagline}</p>
        </div>
        <div class="module-tabs">${tabs}</div>
        <div id="moduleContent">${content}</div>
      </div>`;
      bindModule(fullSys, mod, fullSys.designMd);
      animateSystemView();
    }

    /* ===== Module 1: Doc (copyable markdown) ===== */
    function docModule(sys, md){
      return `<div class="doc-toolbar">
        <div class="seg" id="docSeg">
          <button class="active" data-mode="raw">源码</button>
          <button data-mode="rendered">预览</button>
        </div>
        <div class="spacer"></div>
        <button class="download-btn" id="downloadBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          下载
        </button>
        <button class="copy-btn" id="copyBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          复制文档
        </button>
      </div>
      <div id="docBody"><pre class="doc-raw">${escapeHtml(md)}</pre></div>`;
    }
    function bindModule(sys, mod, md){
      if(mod==='doc'){
        const seg = document.getElementById('docSeg');
        const body = document.getElementById('docBody');
        seg.addEventListener('click', e=>{
          const b = e.target.closest('button'); if(!b) return;
          seg.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
          b.classList.add('active');
          if(b.dataset.mode==='raw') body.innerHTML = `<pre class="doc-raw">${escapeHtml(md)}</pre>`;
          else body.innerHTML = `<div class="doc-rendered">${marked.parse(md)}</div>`;
        });
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.addEventListener('click', ()=>{
          navigator.clipboard.writeText(md).then(()=>{
            copyBtn.classList.add('copied');
            copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>已复制`;
            setTimeout(()=>{ copyBtn.classList.remove('copied');
              copyBtn.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制文档`;
            },2000);
          });
        });
        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.addEventListener('click', ()=>{
          const filename = `${sys.id}-design-system.md`;
          const blob = new Blob([md], {type:'text/markdown;charset=utf-8'});
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(()=>URL.revokeObjectURL(url), 1000);
          /* Fallback: sandboxed iframe may block download — also copy to clipboard */
          if(window.self !== window.top){
            navigator.clipboard.writeText(md).then(()=>{
              downloadBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>已复制·粘贴保存`;
              downloadBtn.style.borderColor = 'var(--color-primary)';
              downloadBtn.style.color = 'var(--color-primary)';
              setTimeout(()=>{
                downloadBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>下载`;
                downloadBtn.style.borderColor = '';
                downloadBtn.style.color = '';
              }, 2500);
            }).catch(()=>{});
          }
        });
      }
      if(mod==='system'){
        document.querySelectorAll('.toggle').forEach(t=>t.addEventListener('click',()=>t.classList.toggle('on')));
      }
      if(mod==='animation'){
        var animCopyBtn = document.getElementById('animCopyBtn');
        if(animCopyBtn){
          animCopyBtn.addEventListener('click', function(){
            var cmd = '安装这个 skill：https://github.com/greensock/gsap-skills';
            navigator.clipboard.writeText(cmd).then(function(){
              animCopyBtn.classList.add('copied');
              animCopyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>已复制';
              setTimeout(function(){
                animCopyBtn.classList.remove('copied');
                animCopyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制指令';
              }, 2000);
            }).catch(function(){});
          });
        }
      }
    }
    function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function isLightColor(hex){
      if(!hex||!hex.match(/^#[0-9a-fA-F]{6}$/)) return false;
      var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
      return (r*0.299+g*0.587+b*0.114)>186;
    }

    /* ===== GSAP Animations ===== */
    const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function animateGallery(){
      if(reducedMotion()) return;
      /* Orbit items: continuous rotation + float */
      const orbitItems = document.querySelectorAll('.hero-orbit-item');
      orbitItems.forEach((item, i) => {
        const dir = i % 2 === 0 ? 1 : -1;
        const speed = 8 + (i % 5) * 3;
        const zDepth = 30 + (i % 4) * 28;
        gsap.set(item, { z: zDepth, transformPerspective: 700 });
        gsap.to(item, { rotation: 360 * dir, duration: speed, repeat: -1, ease: 'none' });
        gsap.to(item, { y: '+=14', duration: 2 + (i % 3) * 0.6, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: i * 0.15 });
        gsap.to(item, { rotateX: (i % 3) * 5 - 5, rotateY: (i % 5) * 4 - 8, duration: 3 + (i % 3) * 0.8, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: i * 0.2 });
      });
      /* Hero content entrance */
      const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
      tl.from('.hero-title', { y: 30, opacity: 0, duration: .8 })
        .from('.poem-line', { y: 14, opacity: 0, duration: .7, stagger: .3 }, '-=.4')
        .from('.gallery-filter-row', { opacity: 0, y: 10, duration: .4 }, '-=.2')
        .from('.sys-card', { y: 30, opacity: 0, rotateX: 4, duration: .7, stagger: .12 }, '-=.35')
        .from('.gallery-footer', { opacity: 0, y: 10, duration: .4 }, '-=.4');
      bindCardHover();
      bindGlobalHover();
    }

    function bindCardHover(){
      if(reducedMotion()) return;
      document.querySelectorAll('.sys-card').forEach(card=>{
        const shine = card.querySelector('.sys-card-shine');
        card.addEventListener('mousemove', (e)=>{
          const rect = card.getBoundingClientRect();
          const x = ((e.clientX - rect.left) / rect.width) * 100;
          const y = ((e.clientY - rect.top) / rect.height) * 100;
          card.style.setProperty('--shine-x', x + '%');
          card.style.setProperty('--shine-y', y + '%');
          if(shine) shine.style.opacity = '1';
        });
        card.addEventListener('mouseenter', ()=>{
          gsap.to(card, { y: -5, duration: .3, ease: 'power2.out' });
        });
        card.addEventListener('mouseleave', ()=>{
          gsap.to(card, { y: 0, duration: .35, ease: 'power2.out' });
          if(shine) shine.style.opacity = '0';
        });
      });
    }

    /* ===== Global hover effects for all interactive elements ===== */
    function bindGlobalHover(){
      if(reducedMotion()) return;

      /* Magnetic button: follows cursor + press feedback */
      function magneticBtn(selector){
        document.querySelectorAll(selector).forEach(el=>{
          if(el._gsMag) return; el._gsMag=true;
          el.addEventListener('mouseenter',()=>gsap.to(el,{scale:1.05,duration:.3,ease:'power2.out'}));
          el.addEventListener('mousemove',e=>{
            const r=el.getBoundingClientRect();
            gsap.to(el,{x:(e.clientX-r.left-r.width/2)*.25,y:(e.clientY-r.top-r.height/2)*.25,duration:.3,ease:'power2.out'});
          });
          el.addEventListener('mousedown',()=>gsap.to(el,{scale:.95,duration:.1,ease:'power2.in'}));
          el.addEventListener('mouseup',()=>gsap.to(el,{scale:1.05,duration:.2,ease:'power2.out'}));
          el.addEventListener('mouseleave',()=>gsap.to(el,{x:0,y:0,scale:1,duration:.5,ease:'elastic.out(1,.4)'}));
        });
      }
      /* Press button: lift on hover, push down on click */
      function pressBtn(selector){
        document.querySelectorAll(selector).forEach(el=>{
          if(el._gsPress) return; el._gsPress=true;
          el.addEventListener('mouseenter',()=>gsap.to(el,{y:-2,scale:1.03,duration:.25,ease:'power2.out'}));
          el.addEventListener('mousedown',()=>gsap.to(el,{y:1,scale:.97,duration:.1,ease:'power2.in'}));
          el.addEventListener('mouseup',()=>gsap.to(el,{y:-2,scale:1.03,duration:.2,ease:'power2.out'}));
          el.addEventListener('mouseleave',()=>gsap.to(el,{y:0,scale:1,duration:.3,ease:'power2.out'}));
        });
      }
      /* Lift card: elevate + shadow on hover */
      function liftCard(selector,opts){
        opts=opts||{};
        var y=opts.y!=null?opts.y:-4,sc=opts.scale!=null?opts.scale:1.02,
            sh=opts.shadow||'0 10px 28px rgba(0,0,0,.09)',d=opts.dur||.3;
        document.querySelectorAll(selector).forEach(el=>{
          if(el._gsLift) return; el._gsLift=true;
          el.addEventListener('mouseenter',()=>gsap.to(el,{y:y,scale:sc,boxShadow:sh,duration:d,ease:'power2.out'}));
          el.addEventListener('mouseleave',()=>gsap.to(el,{y:0,scale:1,boxShadow:'0 0 0 rgba(0,0,0,0)',duration:d,ease:'power2.out'}));
        });
      }
      /* Micro lift: tiny bounce for small elements */
      function microLift(selector,opts){
        opts=opts||{};
        var y=opts.y!=null?opts.y:-2,sc=opts.scale!=null?opts.scale:1.04,d=opts.dur||.2;
        document.querySelectorAll(selector).forEach(el=>{
          if(el._gsMicro) return; el._gsMicro=true;
          el.addEventListener('mouseenter',()=>gsap.to(el,{y:y,scale:sc,duration:d,ease:'power2.out'}));
          el.addEventListener('mouseleave',()=>gsap.to(el,{y:0,scale:1,duration:d,ease:'power2.out'}));
        });
      }
      /* Row highlight: background tint + optional bar grow */
      function rowHover(selector,barSel){
        document.querySelectorAll(selector).forEach(el=>{
          if(el._gsRow) return; el._gsRow=true;
          el.addEventListener('mouseenter',()=>{
            gsap.to(el,{backgroundColor:'rgba(0,117,222,.04)',duration:.2});
            var bar=barSel?el.querySelector(barSel):null;
            if(bar) gsap.to(bar,{scaleX:1.08,transformOrigin:'left center',duration:.3,ease:'power2.out'});
          });
          el.addEventListener('mouseleave',()=>{
            gsap.to(el,{backgroundColor:'rgba(0,0,0,0)',duration:.2});
            var bar=barSel?el.querySelector(barSel):null;
            if(bar) gsap.to(bar,{scaleX:1,duration:.3,ease:'power2.out'});
          });
        });
      }

      /* ── Top bar ── */
      document.querySelectorAll('.brand').forEach(el=>{
        if(el._gsBrand) return; el._gsBrand=true;
        var back=el.querySelector('.logo-back');
        var mid=el.querySelector('.logo-mid');
        el.addEventListener('mouseenter',()=>{
          gsap.to(el,{scale:1.04,duration:.3,ease:'power2.out'});
          if(back) gsap.to(back,{opacity:0.32,duration:.4,ease:'power2.out'});
          if(mid) gsap.to(mid,{opacity:0.62,duration:.4,ease:'power2.out'});
        });
        el.addEventListener('mouseleave',()=>{
          gsap.to(el,{scale:1,duration:.3,ease:'power2.out'});
          if(back) gsap.to(back,{opacity:0.16,duration:.4,ease:'power2.out'});
          if(mid) gsap.to(mid,{opacity:0.40,duration:.4,ease:'power2.out'});
        });
      });
      document.querySelectorAll('.icon-btn').forEach(el=>{
        if(el._gsIcon) return; el._gsIcon=true;
        el.addEventListener('mouseenter',()=>gsap.to(el,{scale:1.1,rotation:8,duration:.25,ease:'back.out(1.7)'}));
        el.addEventListener('mouseleave',()=>gsap.to(el,{scale:1,rotation:0,duration:.3,ease:'power2.out'}));
      });

      /* ── Module tabs ── */
      microLift('.module-tab:not(.active)',{y:-2,scale:1});

      /* ── Hero: orbit parallax + title 3D tilt ── */
      var hero=document.querySelector('.gallery-hero');
      if(hero&&!hero._gsParallax){
        hero._gsParallax=true;
        var orbit=hero.querySelector('.hero-orbit');
        var hContent=hero.querySelector('.hero-content');
        hero.addEventListener('mousemove',function(e){
          var r=hero.getBoundingClientRect();
          var dx=(e.clientX-r.left-r.width/2)/(r.width/2);
          var dy=(e.clientY-r.top-r.height/2)/(r.height/2);
          if(orbit) gsap.to(orbit,{x:dx*14,y:dy*10,rotateY:dx*4,rotateX:-dy*4,duration:.6,ease:'power1.out'});
          if(hContent) gsap.to(hContent,{rotateY:dx*3,rotateX:-dy*3,duration:.5,ease:'power1.out'});
        });
        hero.addEventListener('mouseleave',function(){
          if(orbit) gsap.to(orbit,{x:0,y:0,rotateX:0,rotateY:0,duration:.8,ease:'power2.out'});
          if(hContent) gsap.to(hContent,{rotateX:0,rotateY:0,duration:.6,ease:'power2.out'});
        });
      }
      /* Hero title subtle scale on hover */
      var heroTitle=document.querySelector('.hero-title');
      if(heroTitle&&!heroTitle._gsTitleMag){
        heroTitle._gsTitleMag=true;
        heroTitle.addEventListener('mouseenter',()=>gsap.to(heroTitle,{scale:1.02,duration:.4,ease:'power2.out'}));
        heroTitle.addEventListener('mouseleave',()=>gsap.to(heroTitle,{scale:1,duration:.4,ease:'power2.out'}));
      }

      /* ── Magnetic primary buttons ── */
      magneticBtn('.btn-primary');
      magneticBtn('.btn-accent');
      magneticBtn('.a-btn-filled:not(.a-btn-sm)');
      magneticBtn('.copy-btn');
      magneticBtn('.download-btn');

      /* ── Press buttons ── */
      pressBtn('.btn-secondary');
      pressBtn('.btn-ghost');

      /* ── Card lifts ── */
      liftCard('.swatch',{y:-4,scale:1.03,shadow:'0 10px 28px rgba(0,0,0,.10)'});
      liftCard('.a-swatch',{y:-4,scale:1.03,shadow:'0 10px 28px rgba(0,0,0,.10)'});

      liftCard('.case-frame',{y:-2,scale:1.005,shadow:'0 12px 36px rgba(0,0,0,.08)',dur:.4});

      /* ── Micro lifts: small interactive elements ── */
      microLift('.mod-link',{y:-2,scale:1.03});
      microLift('.gallery-add-link',{y:-1,scale:1.02});
      microLift('.tag',{y:-1,scale:1.06});
      microLift('.icon-tile',{y:-2,scale:1.08});
      microLift('.seg button',{y:0,scale:1.03,dur:.15});
      microLift('.a-ghost-link',{y:0,scale:1.02});
      microLift('.a-nav-link',{y:0,scale:1.05});
      microLift('.a-footer-col a',{y:0,scale:1.02});
      microLift('.a-footer-col h4',{y:0,scale:1.02});
      microLift('.radius-demo',{y:-2,scale:1.05});
      microLift('.a-radius-demo',{y:-2,scale:1.05});
      microLift('.elev-demo',{y:-2,scale:1.05});
      microLift('.a-surface-demo',{y:-2,scale:1.05});

      document.querySelectorAll('.gallery-add-link').forEach(el=>{
        if(el._gsAddIcon) return; el._gsAddIcon=true;
        var icon=el.querySelector('svg');
        el.addEventListener('mouseenter',()=>{if(icon)gsap.to(icon,{rotation:90,duration:.3,ease:'power2.out'})});
        el.addEventListener('mouseleave',()=>{if(icon)gsap.to(icon,{rotation:0,duration:.3,ease:'power2.out'})});
        el.addEventListener('click',function(e){e.preventDefault();openAddModal();});

      /* ── Toggle click bounce ── */

        if(el._gsToggle) return; el._gsToggle=true;
        el.addEventListener('click',()=>gsap.fromTo(el,{scale:.88},{scale:1,duration:.35,ease:'back.out(2.5)'}));
      });

      /* ── Section titles slide right ── */
      document.querySelectorAll('.section-title, .a-section-title').forEach(el=>{
        if(el._gsSecTitle) return; el._gsSecTitle=true;
        el.addEventListener('mouseenter',()=>gsap.to(el,{x:4,duration:.25,ease:'power2.out'}));
        el.addEventListener('mouseleave',()=>gsap.to(el,{x:0,duration:.25,ease:'power2.out'}));

      rowHover('.type-row');
      rowHover('.a-type-row');

      rowHover('.a-spacing-row','.a-spacing-bar');

        if(el._gsTokRow) return; el._gsTokRow=true;
        el.addEventListener('mouseenter',()=>gsap.to(el,{backgroundColor:'rgba(0,117,222,.04)',duration:.2}));
        el.addEventListener('mouseleave',()=>gsap.to(el,{backgroundColor:'rgba(0,0,0,0)',duration:.2}));
      });
    }

          '<button class="modal-copy-email-btn" id="modalCopyEmail">复制</button>'+
        '</div>'+
        '<p class="modal-desc" style="font-size:12px;color:var(--color-text-muted);margin-bottom:16px">复制邮箱地址后即可在邮件客户端中发送</p>'+
        '<div style="margin-bottom:20px;text-align:center">'+
          '<img src="qr-code.jpg" alt="二维码" style="width:140px;height:140px;border-radius:8px;display:block;margin:0 auto 8px">'+
          '<p style="font-size:11px;color:var(--color-text-muted);margin:0">扫码联系</p>'+
        '</div>'+
        '<button class="modal-btn modal-btn-primary" id="modalDone">知道了</button>'+
      '</div>';
      document.body.appendChild(overlay);
      gsap.set(overlay,{opacity:0});
      gsap.set(overlay.querySelector('.modal-box'),{y:16,scale:.96,opacity:0});
      gsap.to(overlay,{opacity:1,duration:.25,ease:'power2.out'});
      gsap.to(overlay.querySelector('.modal-box'),{y:0,scale:1,opacity:1,duration:.35,ease:'back.out(1.4)'});
      overlay.querySelector('.modal-close').addEventListener('click',closeAddModal);
      overlay.querySelector('#modalDone').addEventListener('click',closeAddModal);
      overlay.addEventListener('click',function(e){if(e.target===overlay)closeAddModal();});
      document.addEventListener('keydown',escCloseModal);
      /* Bind email copy */
      var copyBtn = overlay.querySelector('#modalCopyEmail');
      if(copyBtn) copyBtn.addEventListener('click', function(){
        navigator.clipboard.writeText('3020006530@qq.com').then(function(){
          copyBtn.textContent = '已复制';
          copyBtn.classList.add('copied');
          setTimeout(function(){ copyBtn.textContent = '复制'; copyBtn.classList.remove('copied'); }, 2000);
        }).catch(function(){});
      });
    }

    function closeAddModal(){
      var overlay=document.getElementById('addModal');
      if(!overlay) return;
      document.removeEventListener('keydown',escCloseModal);
      gsap.to(overlay,{opacity:0,duration:.2,ease:'power2.out'});
      gsap.to(overlay.querySelector('.modal-box'),{y:10,scale:.97,opacity:0,duration:.2,ease:'power2.in',onComplete:function(){
        overlay.remove();
      }});
    }

    /* ===== Render ===== */
    function escCloseModal(e){if(e.key==='Escape')closeAddModal();}
    async function render(){
      await dataInitPromise;
      const {sys,mod} = parseHash();
      window.scrollTo(0,0);
      pageTransition(()=>{
        if(!sys){ galleryView(); return; }
        return systemView(sys, mod);
      });
    }
    render();
  </script>
</body>
</html>
